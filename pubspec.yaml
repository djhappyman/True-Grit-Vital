name: true_grit_vital
description: Local substance tracking for adults.
publish_to: none
version: 0.1.0+2

environment:
  sdk: '>=3.13.5 <4.0.0'
  flutter: '>=3.47.7'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  drift: 2.35.2
  sqlite3: 3.7.1
  crypto: 3.0.7
  intl: 0.20.3
  cryptography: 2.9.0
  file_picker: 13.1.0
  fl_chart: 1.2.0
  pdf: 3.13.1
  pdfrx: 2.6.6
  timezone: 0.11.2
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.0
  liquid_glass_widgets: ^1.13.0
  shadcn_flutter: ^0.0.55
  flutter_zxing: 3.1.0
  camera: 0.12.1

dependency_overrides:
  pdfium_dart:
    path: third_party/pdfium_dart

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  camera_platform_interface: 2.15.0

flutter:
  generate: true
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
    - family: StitchSans
      fonts:
        - asset: assets/fonts/StitchNotoSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/StitchNotoSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/StitchNotoSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/StitchNotoSans-Bold.ttf
          weight: 700
  assets:
    - LICENSE
    - assets/fonts/
    - assets/legal/
    - docs/implementation/licenses/

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
